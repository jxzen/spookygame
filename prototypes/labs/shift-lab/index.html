<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Lab</title>
<style>
  :root { --ink:#0a0a0a; --paper:#e8e6e0; --grey:#8a8884; --red:#c4121c; }
  html, body { margin:0; height:100%; background:#050505; color:var(--paper); font:13px/1.45 "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #panel { position:fixed; left:12px; top:12px; max-width:340px; background:rgba(5,5,5,.72); border:1px solid #2a2a2a; padding:10px 12px; }
  #panel h1 { font-size:14px; margin:0 0 6px; letter-spacing:.12em; text-transform:uppercase; }
  #panel h1 b { color:var(--red); }
  #fxlist { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  #fxlist button { background:#151515; color:var(--paper); border:1px solid #333; padding:4px 7px; font:inherit; cursor:pointer; }
  #fxlist button.on { border-color:var(--red); color:#fff; background:#2a0b0d; }
  #rule { color:#cfcdc7; margin:4px 0 6px; }
  #rule em { color:var(--red); font-style:normal; }
  #opts { color:var(--grey); font-size:12px; }
  #opts label { margin-right:10px; cursor:pointer; }
  #beat { position:fixed; right:14px; top:14px; display:flex; gap:6px; }
  #beat i { width:12px; height:12px; border:1px solid #666; border-radius:50%; display:block; }
  #beat i.rest { border-color:var(--red); }
  #beat i.on { background:var(--paper); }
  #beat i.rest.on { background:var(--red); }
  #status { position:fixed; right:14px; top:34px; color:var(--grey); font-size:12px; text-align:right; }
  #cross { position:fixed; left:50%; top:50%; width:4px; height:4px; margin:-2px; background:rgba(255,255,255,.5); border-radius:50%; pointer-events:none; }
  #msg { position:fixed; left:0; right:0; bottom:16%; text-align:center; font-size:20px; letter-spacing:.2em; text-transform:uppercase; opacity:0; transition:opacity .5s; pointer-events:none; text-shadow:0 0 12px #000; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; }
  #help { position:fixed; left:12px; bottom:10px; color:#77756f; font-size:12px; }
  @media (max-width:600px) { #panel { left:8px; right:8px; max-width:none; } #help { display:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"></div>
<div id="fade"></div>
<div id="panel">
  <h1>Shift Lab <b>/</b> the castle plays you</h1>
  <div id="fxlist"></div>
  <div id="rule"></div>
  <div id="opts">
    <label><input type="checkbox" id="rm"> reduce motion (M)</label>
    <label><input type="checkbox" id="mute"> mute (N)</label>
    R restart
  </div>
</div>
<div id="beat"></div>
<div id="status"></div>
<div id="msg"></div>
<div id="help">Click to look (pointer lock; drag works too) · WASD move · Shift run · 1-5 effects</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../shared/shift.js"></script>
<script>
(function () {
'use strict';
const WS = window.WorldShift, PAL = WS.PAL, A = WS.audio;
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 500);
const ctl = new WS.Controller(camera, canvas);
const koto = new WS.Koto({});
ctl.onGesture = () => { A.init(); };
let scene = null, fx = null, fxName = 'stretch', frozen = false, fadeT = 0, msgTimer = 0;

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function msg(text, dur) { $('msg').textContent = text; $('msg').style.opacity = 1; msgTimer = dur || 2.5; }
function fade(v) { $('fade').style.opacity = v; }
function setFov(f) { if (Math.abs(camera.fov - f) > .01) { camera.fov = f; camera.updateProjectionMatrix(); } }
function newScene(bg, fogD) { const s = new THREE.Scene(); s.background = new THREE.Color(bg); s.fog = new THREE.FogExp2(bg, fogD); return s; }
function M(o) { return WS.mat(o); }
const add = (p, o) => { p.add(o); return o; };
function point(parent, x, y, z, color, intensity, dist) { const l = new THREE.PointLight(color, intensity, dist, 2); l.position.set(x, y, z); parent.add(l); return l; }

/* beat HUD */
function beatHud() {
  const b = $('beat'); b.innerHTML = '';
  for (let i = 0; i < koto.beatsPerBar; i++) { const d = document.createElement('i'); if (koto.rests.indexOf(i) >= 0) d.className = 'rest'; b.appendChild(d); }
}
function beatHudTick() {
  const ib = koto.inBar(), dots = $('beat').children;
  for (let i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i === ib && koto.phase() < .45);
}

/* ======================================================================
   (a) HALLWAY STRETCH: the koto bends a low string; the hall lengthens with the pitch.
   ====================================================================== */
function fxStretch() {
  koto.configure({ bpm: 72, beatsPerBar: 4, rests: [3] });
  scene = newScene(0x070707, .035);
  scene.add(new THREE.HemisphereLight(0x8a8884, 0x050505, .35));
  const W = 3, H = 3, Z0 = 6, Z1 = -30, L = Z0 - Z1, DOORZ = -30;
  const grp = add(scene, new THREE.Group());
  const floor = add(grp, WS.plane(W, L, M({ map: WS.tex('tatami', 1, L / 2) }))); floor.rotation.x = -Math.PI / 2; floor.position.z = (Z0 + Z1) / 2;
  const ceil = add(grp, WS.plane(W, L, M({ map: WS.tex('beams', 1, L / 2) }))); ceil.rotation.x = Math.PI / 2; ceil.position.set(0, H, (Z0 + Z1) / 2);
  for (const s of [-1, 1]) {
    const wall = add(grp, WS.plane(L, H, M({ map: WS.tex('shoji', L / 2, 1), emissive: 0x2c2b28, emissiveMap: WS.tex('shoji', L / 2, 1) })));
    wall.rotation.y = s < 0 ? Math.PI / 2 : -Math.PI / 2; wall.position.set(s * W / 2, H / 2, (Z0 + Z1) / 2);
  }
  const wood = M({ color: 0x141210 });
  for (let z = Z0; z >= Z1; z -= 2) { add(grp, WS.box(.16, H, .16, wood, -W / 2 + .08, H / 2, z)); add(grp, WS.box(.16, H, .16, wood, W / 2 - .08, H / 2, z)); add(grp, WS.box(W, .16, .16, wood, 0, H - .08, z)); }
  const back = add(grp, WS.plane(W, H, M({ color: 0x0a0a0a }))); back.position.set(0, H / 2, Z0);
  const lanterns = [];
  for (let z = -2; z > Z1; z -= 6) { const l = WS.lantern({ cord: .4 }); l.position.set(0, H - .7, z); grp.add(l); lanterns.push(l); }
  for (const z of [-4, -16, -27]) point(grp, 0, 2.4, z, 0xfff1dd, 1.4, 14);
  // the goal: a red door that is always visible (a beacon through the fog)
  const door = add(scene, new THREE.Group());
  add(door, WS.box(1.3, 2.3, .08, WS.basic(PAL.red, false), 0, 1.15, 0));
  add(door, WS.box(1.6, .12, .12, WS.basic(0x000000, false), 0, 2.36, 0));
  const doorLight = point(door, 0, 1.4, .6, 0xff2020, 1.2, 6);
  // the thing behind you: moves only on the rest beat
  const fig = add(scene, WS.figure());
  const S = new WS.Stretch();
  const st = { figL: 5.2, won: 0, caught: 0 };
  const smax = () => WS.reduceMotion ? 1.8 : 3.4;
  koto.on(ev => {
    const cyc = ev.bar % 4;
    if (ev.inBar === 0 && cyc === 1) { A.pluck(0, { vol: .7, bend: .74, bendTime: koto.barLen() * 2 }); A.drone(true); }
    if (ev.inBar === 0 && cyc === 3) { A.pluck(9, { vol: .7 }); A.clack(.6); }
    if (ev.rest) { st.figL -= .9; A.knock(.25); }
  });
  function sAt(t) {
    const bl = koto.barLen(), tc = t % (bl * 4);
    if (tc < bl) return 1;
    if (tc < bl * 3) return 1 + (smax() - 1) * WS.smooth((tc - bl) / (bl * 2));
    return smax() + (1 - smax()) * WS.easeOut((tc - bl * 3) / .35);
  }
  return {
    name: 'Hallway stretch',
    rule: 'The koto <em>bends a low string</em> and the hall lengthens with the pitch: lower note, longer hall. On the sharp pluck it snaps back. Walk on the snap and the rest; walking during the bend gains almost nothing. The thing behind you moves only on the rest beat.',
    spawn() { ctl.pos.set(0, 0, 0); ctl.yaw = 0; ctl.pitch = 0; S.s = 1; S.A = 0; S.B = 0; st.figL = 5.2; st.won = 0; },
    update(dt) {
      const d = ctl.flatDelta(dt);
      ctl.pos.x = WS.clamp(ctl.pos.x + d.x, -1.15, 1.15);
      ctl.pos.z += d.z;
      let pl = S.toLevel(ctl.pos.z); pl = WS.clamp(pl, DOORZ + .6, Z0 - .5); ctl.pos.z = S.toWorld(pl);
      S.setScale(sAt(koto.t), ctl.pos.z); S.applyTo(grp);
      door.position.z = S.toWorld(DOORZ);
      fig.position.set(0, 0, S.toWorld(Math.min(st.figL, Z0 - .3))); fig.rotation.y = Math.PI;
      fig.visible = st.figL < Z0 - .2;
      doorLight.intensity = 1 + .4 * Math.sin(koto.t * 3);
      for (const l of lanterns) l.rotation.x = (S.s - 1) * .06 * Math.sin(koto.t * 1.3);
      setFov(WS.reduceMotion ? 70 : WS.dollyFov(70, S.s, 22));
      scene.fog.density = .035 + (S.s - 1) * .006;
      if (pl < DOORZ + 1.2 && !st.won) { st.won = 1; msg('through the door', 2); setTimeout(() => load('stretch'), 1600); }
      if (st.figL - pl < .8 && !st.caught) { st.caught = 1; msg('it reached you', 2); fade(1); setTimeout(() => { fade(0); load('stretch'); }, 1400); }
      return `stretch ×${S.s.toFixed(2)} · door ${(pl - DOORZ).toFixed(1)} m (level) / ${(S.s * (pl - DOORZ)).toFixed(1)} m (seen) · fov ${camera.fov.toFixed(0)}°`;
    }
  };
}

/* ======================================================================
   (b) LOOPING CORRIDOR: P.T.-style seamless loop. Each lap the koto adds one note.
   ====================================================================== */
function fxLoop() {
  koto.configure({ bpm: 60, beatsPerBar: 4, rests: [3] });
  scene = newScene(0x050505, .06);
  scene.add(new THREE.HemisphereLight(0x6a6866, 0x050505, .25));
  const W = 2.4, H = 2.8, DX = 6.5;
  // T maps the corridor start (0,0,1) heading -z onto the end door D (6.5,0,-17.2) heading +x
  const T = new WS.Rigid(-Math.PI / 2, 7.5, -17.2), Ti = T.inverse();
  function buildCopy() {
    const g = new THREE.Group(), P = {};
    const fl = M({ map: WS.tex('wood', 2, 8) }), wl = M({ map: WS.tex('plaster', 6, 1) }), cl = M({ color: 0x3a3836 });
    const f1 = add(g, WS.plane(W, 19.4, fl)); f1.rotation.x = -Math.PI / 2; f1.position.z = -8.7;
    const f2 = add(g, WS.plane(5.3, W, fl)); f2.rotation.x = -Math.PI / 2; f2.position.set(3.85, 0, -17.2);
    const c1 = add(g, WS.plane(W, 19.4, cl)); c1.rotation.x = Math.PI / 2; c1.position.set(0, H, -8.7);
    const c2 = add(g, WS.plane(5.3, W, cl)); c2.rotation.x = Math.PI / 2; c2.position.set(3.85, H, -17.2);
    const wL = add(g, WS.plane(19.4, H, wl)); wL.rotation.y = Math.PI / 2; wL.position.set(-1.2, H / 2, -8.7);
    const wR = add(g, WS.plane(17, H, wl)); wR.rotation.y = -Math.PI / 2; wR.position.set(1.2, H / 2, -7.5);
    const wF = add(g, WS.plane(7.7, H, wl)); wF.position.set(2.65, H / 2, -18.4);
    const wN = add(g, WS.plane(5.3, H, wl)); wN.rotation.y = Math.PI; wN.position.set(3.85, H / 2, -16);
    const dark = M({ color: 0x0e0d0c });
    add(g, WS.box(.12, H, .2, dark, DX, H / 2, -16.05)); add(g, WS.box(.12, H, .2, dark, DX, H / 2, -18.35)); add(g, WS.box(.12, .3, W, dark, DX, H - .15, -17.2));
    // door D, hinged at its far post, swung open into the corridor
    P.doorPivot = add(g, new THREE.Group()); P.doorPivot.position.set(DX - .05, 0, -18.3);
    P.doorMat = M({ color: 0x1c1a18 });
    const dp = add(P.doorPivot, WS.box(2.1, 2.5, .06, P.doorMat, 0, 1.25, 1.05)); dp.rotation.y = Math.PI / 2; dp.position.set(-1.05 * 0, 1.25, 1.05);
    P.doorPivot.rotation.y = -1.25;
    // props (one group so a lap can flip them onto the ceiling)
    P.props = add(g, new THREE.Group());
    const tbl = add(P.props, new THREE.Group()); tbl.position.set(-.85, 0, -5);
    add(tbl, WS.box(.5, .7, .9, M({ color: 0x1a1816 }), 0, .35, 0));
    P.vase = add(tbl, new THREE.Mesh(new THREE.CylinderGeometry(.06, .1, .32, 10), M({ color: 0xd8d6d0 }))); P.vase.position.y = .86;
    P.clock = add(P.props, new THREE.Group()); P.clock.position.set(-1.18, 2.0, -3); P.clock.rotation.y = Math.PI / 2;
    add(P.clock, new THREE.Mesh(new THREE.CircleGeometry(.24, 24), WS.mat({ color: 0xe8e6e0, side: THREE.DoubleSide })));
    P.hand = add(P.clock, WS.box(.02, .18, .01, WS.basic(0x080808), 0, .08, .01));
    P.photo = add(P.props, new THREE.Group()); P.photo.position.set(1.17, 1.6, -10); P.photo.rotation.y = -Math.PI / 2;
    add(P.photo, WS.box(.6, .8, .03, M({ color: 0x0a0a0a }), 0, 0, 0));
    const pic = add(P.photo, WS.plane(.5, .7, M({ color: 0x9a9894 }))); pic.position.z = .02;
    const head = add(P.photo, new THREE.Mesh(new THREE.CircleGeometry(.1, 16), WS.basic(0x222222))); head.position.set(0, .12, .025);
    add(P.photo, WS.box(.26, .3, .005, WS.basic(0x222222), 0, -.15, .025));
    P.shoji = add(P.props, WS.box(.04, 2.1, 1.4, M({ map: WS.tex('shoji', 1, 1), emissive: 0x222120, emissiveMap: WS.tex('shoji', 1, 1) }), 1.17, 1.05, -12.5));
    P.redGap = add(P.props, WS.plane(.12, 2.0, WS.basic(PAL.glow))); P.redGap.rotation.y = -Math.PI / 2; P.redGap.position.set(1.19, 1.05, -11.75);
    P.hands = [];
    for (const [x, y, z, ry] of [[-1.18, 1.3, -7, Math.PI / 2], [1.18, 1.1, -8.5, -Math.PI / 2], [-1.18, 1.6, -13, Math.PI / 2], [2.5, 1.2, -18.38, 0]]) {
      const h = add(P.props, WS.plane(.3, .38, WS.mat({ map: WS.tex('hand'), transparent: true }))); h.position.set(x, y, z); h.rotation.y = ry; P.hands.push(h);
    }
    P.fig = add(g, WS.figure()); P.fig.position.set(.2, 0, -17.6); P.fig.rotation.y = 0;
    P.lampA = WS.lantern({ cord: .3 }); P.lampA.position.set(0, H - .55, -8); g.add(P.lampA);
    P.lampB = WS.lantern({ cord: .3 }); P.lampB.position.set(3.4, H - .55, -17.2); g.add(P.lampB);
    P.l1 = point(g, 0, 2.2, -8, 0xfff0dc, 1.2, 12); P.l2 = point(g, 3.4, 2.2, -17.2, 0xfff0dc, 1, 9);
    g.userData.P = P; scene.add(g); return g;
  }
  const copies = { A: buildCopy(), B: buildCopy(), C: buildCopy() };
  T.place(copies.B); Ti.place(copies.C);
  function variant(g, lap) {
    const P = g.userData.P; lap = Math.max(0, lap); P.lap = lap;
    P.hand.parent.rotation.z = 0; P.clock.children[1].rotation.z = 0;
    P.hand.rotation.z = -lap * 1.1; P.hand.position.set(Math.sin(lap * 1.1) * .08, Math.cos(lap * 1.1) * .08, .01);
    P.vase.rotation.z = lap >= 1 ? 1.4 : 0; P.vase.position.set(lap >= 1 ? .12 : 0, lap >= 1 ? .76 : .86, 0);
    P.photo.rotation.z = lap >= 2 ? Math.PI : 0;
    P.shoji.position.z = lap >= 2 ? -12.65 : -12.5; P.redGap.visible = lap >= 2;
    P.hands.forEach((h, i) => { h.visible = lap >= 3 && i < lap - 1; });
    P.fig.visible = lap === 3;
    P.props.position.y = lap === 4 ? H : 0; P.props.scale.y = lap === 4 ? -1 : 1;
    P.props.visible = lap < 5;
    const dim = lap >= 3;
    P.l1.color.set(dim ? 0xff2020 : 0xfff0dc); P.l2.color.set(dim ? 0xff2020 : 0xfff0dc);
    P.l1.intensity = dim ? .5 : 1.2; P.l2.intensity = dim ? .4 : 1;
    P.lampA.userData.paper.color.set(dim ? 0x5a0a0e : 0xe9e4d6); P.lampB.userData.paper.color.set(dim ? 0x5a0a0e : 0xe9e4d6);
    P.doorMat.color.set(lap >= 5 ? PAL.red : 0x1c1a18); P.doorMat.emissive = new THREE.Color(lap >= 5 ? 0x400000 : 0);
  }
  const st = { lap: 0, won: 0 };
  function applyLaps() { variant(copies.A, st.lap); variant(copies.B, st.lap + 1); variant(copies.C, st.lap - 1); }
  function phrase(n) { for (let i = 0; i <= n; i++) A.pluck([4, 6, 7, 5, 9, 0][i], { vol: .45, delay: i * .42 }); }
  koto.on(ev => { if (ev.inBar === 0 && ev.bar % 2 === 0) A.pluck(0, { vol: .18 }); });
  function inside(x, z) { return (Math.abs(x) <= .9 && z >= -18.1) || (x >= -.9 && z <= -16.3 && z >= -18.1); }
  return {
    name: 'Looping corridor',
    rule: 'The corridor is <em>a phrase</em>. Each lap through the end door the koto adds one note and one thing changes. On the fifth note the door turns red and lets you out. Walking back out the start sends you back a lap.',
    spawn() { ctl.pos.set(0, 0, .3); ctl.yaw = 0; ctl.pitch = 0; st.lap = 0; st.won = 0; applyLaps(); },
    setLap(n) { st.lap = n; applyLaps(); },
    update(dt) {
      setFov(70);
      const d = ctl.flatDelta(dt), p = ctl.pos;
      if (inside(p.x + d.x, p.z + d.z)) { p.x += d.x; p.z += d.z; } else if (inside(p.x + d.x, p.z)) p.x += d.x; else if (inside(p.x, p.z + d.z)) p.z += d.z;
      if (p.x > DX && p.z < -16) {
        if (st.lap >= 5) { if (!st.won) { st.won = 1; msg('out of the loop', 2.5); fade(1); setTimeout(() => { fade(0); load('loop'); }, 1800); } }
        else { T.invert(p); ctl.yaw += Math.PI / 2; st.lap++; applyLaps(); phrase(st.lap); }
      } else if (p.z > 1 && Math.abs(p.x) < 1.2) { T.apply(p); ctl.yaw -= Math.PI / 2; st.lap = Math.max(0, st.lap - 1); applyLaps(); }
      const P = copies.A.userData.P;
      if (st.lap === 2) P.l1.intensity = Math.random() < .06 ? 0 : 1.2;
      copies.A.userData.P.lampA.rotation.z = Math.sin(koto.t * 1.7) * (st.lap >= 1 ? .12 : .02);
      return `lap ${st.lap} / 5 · notes heard ${st.lap}`;
    }
  };
}

/* ======================================================================
   shared: castle field (rooms on rails that move on plucks; the visible mechanism)
   ====================================================================== */
function castleField(parent, opts) {
  const rows = [], paperM = M({ map: WS.tex('shoji', 1, 1), emissive: 0x3a3936, emissiveMap: WS.tex('shoji', 1, 1) }), darkM = M({ color: 0x0c0b0a }), railM = M({ color: 0x050505, rough: .4 });
  const layers = opts.layers || [-16, 18], n = opts.rows || 5;
  for (let r = 0; r < n; r++) {
    const z = opts.z0 - r * 8, row = { g: new THREE.Group(), off: 0, from: 0, to: 0, t: 1, dir: r % 2 ? -1 : 1 };
    parent.add(row.g);
    for (const y of layers) {
      add(parent, WS.box(120, .25, .25, railM, 0, y - 2.2, z - 2)); add(parent, WS.box(120, .25, .25, railM, 0, y - 2.2, z + 2));
      for (let i = -3; i <= 3; i++) {
        if ((i + r) % 3 === 0) continue;
        const room = add(row.g, new THREE.Group()); room.position.set(i * 9, y, z);
        add(room, WS.box(6, 4, 6, darkM, 0, 0, 0));
        const f = add(room, WS.plane(5.6, 3.4, paperM)); f.position.z = 3.01;
        const b = add(room, WS.plane(5.6, 3.4, paperM)); b.position.z = -3.01; b.rotation.y = Math.PI;
        add(room, WS.box(.5, .3, 1.2, WS.basic(PAL.red), 0, -2.15, 0));
      }
    }
    rows.push(row);
  }
  return {
    rows,
    move(r) { const row = rows[r % rows.length]; if (row.off + row.dir > 2 || row.off + row.dir < -2) row.dir *= -1; row.from = row.off; row.to = row.off + row.dir; row.t = 0; row.off = row.to; },
    update(dt) { for (const row of rows) { if (row.t < 1) row.t = Math.min(1, row.t + dt / .42); row.g.position.x = WS.lerp(row.from, row.to, WS.easeOut(row.t)) * 9; } }
  };
}

/* ======================================================================
   (c) ROOM FOLD: origami, one 30° ratchet per pluck, while you stand in it.
   ====================================================================== */
function fxFold() {
  koto.configure({ bpm: 72, beatsPerBar: 4, rests: [3] });
  scene = newScene(0x060606, .018);
  scene.add(new THREE.HemisphereLight(0x8a8884, 0x050505, .3));
  const field = castleField(scene, { z0: 20, rows: 6, layers: [-14, 16] });
  const tat = () => M({ map: WS.tex('tatami', 1, 1) });
  const room = add(scene, new THREE.Group());
  // center tile

      if (Math.abs(fig.position.x - p.x) < 2.5 && Math.abs(fig.position.z - p.z) < 2.5 && !st.caught) { st.caught = 1; msg('it was standing right there', 2); fade(1); setTimeout(() => { fade(0); this.spawn(); }, 1200); }
      fig.lookAt(p.x, 0, p.z);
      const s = support(p.x, p.z);
      return `row ${s && s.row ? rows.indexOf(s.row) + 1 : s ? (s.bank === 1 ? 'start' : 'exit') : '-'} · offsets ${rows.map(r => r.off).join(' ')}`;
    }
  };
}

/* ====================================================================== */
const FX = { stretch: fxStretch, loop: fxLoop, fold: fxFold, gravity: fxGravity, grid: fxGrid };
const KEYS = Object.keys(FX);
const list = $('fxlist');
KEYS.forEach((k, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + k; b.onclick = () => { A.init(); load(k); }; b.dataset.k = k; list.appendChild(b); });

function load(name) {
  fxName = name; koto.clear(); A.drone && A.drone(false);
  if (scene) scene.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  ctl.flatFrame(); ctl.pos.set(0, 0, 0); ctl.roll = 0; fade(0);
  fx = FX[name](); fx.spawn(); koto.reset(); beatHud();
  $('rule').innerHTML = '<b>' + fx.name + '.</b> ' + fx.rule;
  [...list.children].forEach(b => b.classList.toggle('on', b.dataset.k === name));
  try { history.replaceState(null, '', '#fx=' + name); } catch (e) { /* file:// */ }
}

function step(dt) {
  koto.update(dt);
  const s = fx.update(dt);
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) $('msg').style.opacity = 0; }
  $('status').textContent = s || '';
}

$('rm').checked = WS.reduceMotion;
$('rm').onchange = e => { WS.reduceMotion = e.target.checked; };
$('mute').onchange = e => A.setMuted(e.target.checked);
addEventListener('keydown', e => {
  const i = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'].indexOf(e.code);
  if (i >= 0) load(KEYS[i]);
  if (e.code === 'KeyR') load(fxName);
  if (e.code === 'KeyM') { WS.reduceMotion = !WS.reduceMotion; $('rm').checked = WS.reduceMotion; }
  if (e.code === 'KeyN') { $('mute').checked = !$('mute').checked; A.setMuted($('mute').checked); }
});

/* capture hooks: #fx=NAME&t=SECONDS&fwd=1&lap=N&s=ARC&yaw=&pitch=&x=&z=&rm=1&freeze=1 */
const H = new URLSearchParams(location.hash.slice(1));
if (H.get('rm') === '1') { WS.reduceMotion = true; $('rm').checked = true; }
load(FX[H.get('fx')] ? H.get('fx') : 'stretch');
if (H.has('lap') && fx.setLap) fx.setLap(+H.get('lap'));
if (H.has('s') && fx.setS) fx.setS(+H.get('s'));
if (H.has('x')) ctl.pos.x = +H.get('x');
if (H.has('z')) ctl.pos.z = +H.get('z');
if (H.has('yaw')) ctl.yaw = +H.get('yaw');
if (H.has('pitch')) ctl.pitch = +H.get('pitch');
if (H.has('t')) {
  const total = +H.get('t'), fwd = +(H.get('fwd') || 0), walkFor = +(H.get('walk') || total);
  let t = 0; const dt = 1 / 30;
  while (t < total) { ctl.auto = { f: t < walkFor ? fwd : 0 }; step(dt); t += dt; }
  ctl.auto = null;
}
if (H.has('ayaw')) ctl.yaw = +H.get('ayaw');
if (H.has('apitch')) ctl.pitch = +H.get('apitch');
if (H.get('freeze') === '1') { frozen = true; ctl.enabled = false; }

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!frozen) step(dt); else fx.update(0);
  beatHudTick();
  ctl.apply(0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
