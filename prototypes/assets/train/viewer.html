<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #ccc; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; left: 10px; top: 8px; text-shadow: 0 1px 2px #000; }
  #hud b { color: #c4161c; }
</style>
</head>
<body>
<div id="hud">W2-TRAIN viewer · <span id="status">loading…</span><br>?view=platform | nose | interior | window | side · &amp;doors=1 opens doors and gates</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const params = new URLSearchParams(location.search);
const view = params.get("view") || "platform";
const openDoors = params.get("doors") === "1";
const status = document.getElementById("status");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c0e);
scene.fog = new THREE.FogExp2(0x16161a, 0.03);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 400);
scene.add(new THREE.HemisphereLight(0x8a8a96, 0x0a0a0a, 0.25));

function load(url) {
  return new Promise((res, rej) => new THREE.GLTFLoader().load(url, res, undefined, rej));
}
function tris(root) {
  let t = 0;
  root.traverse((o) => { if (o.isMesh) t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  return Math.round(t);
}

function loadJSON(url) {
  return new Promise((res, rej) => new THREE.FileLoader().load(url, (t) => res(JSON.parse(t)), undefined, rej));
}

Promise.all([load("platform.glb"), load("shinkansen.glb"), loadJSON("train.json")]).then(([pg, tg, info]) => {
  const platform = pg.scene, train = tg.scene;
  scene.add(platform);
  const P = info.platform;
  train.position.fromArray(P.train_root_in_platform);
  scene.add(train);
  [platform, train].forEach((r) => r.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } }));
  // lights at the named empties
  let shadowBudget = 4;
  platform.traverse((o) => {
    if (/^LIGHT_platform/.test(o.name)) {
      const L = new THREE.PointLight(0xe8eeff, 1.2, 12, 2);
      if (shadowBudget-- > 0 && /(03|09|15|21)$/.test(o.name)) { L.castShadow = true; L.shadow.mapSize.set(512, 512); L.shadow.bias = -0.004; L.shadow.normalBias = 0.03; }
      o.add(L);
    } else if (o.name === "LIGHT_red_lamp") {
      o.add(new THREE.PointLight(0xff1a10, 2.0, 9, 2));
    }
  });
  train.traverse((o) => { if (/^LIGHT_interior/.test(o.name)) o.add(new THREE.PointLight(0xffe6c2, 0.9, 6, 2)); });
  // open the doors and gates (offsets from train.json)
  if (openDoors) {
    info.doors.forEach((d) => { const n = train.getObjectByName(d.node); if (n) n.position.add(new THREE.Vector3().fromArray(d.open_offset)); });
    P.psd_gates.forEach((g) => { const n = platform.getObjectByName(g.node); if (n) n.position.add(new THREE.Vector3().fromArray(g.open_offset)); });
  }
  const T = (a) => new THREE.Vector3().fromArray(a).add(train.position);
  const I = info.interior;
  const views = {
    platform: [[-4.4, 2.85, 27.0], [-1.2, 2.1, -20]],
    nose: [[3.2, 1.8, -37], [0, 1.4, -22]],
    side: [[-40, 3, -5], [0, 2, -5]],
    interior: [T(I.camera_aisle.pos).toArray(), T(I.camera_aisle.look_at).toArray()],
    window: [T(I.camera_window_seat.pos).toArray(), T(I.camera_window_seat.look_at).toArray()],
  };
  const v = views[view] || views.platform;
  camera.position.fromArray(v[0]);
  camera.lookAt(new THREE.Vector3().fromArray(v[1]));
  if (view === "interior" || view === "window") camera.fov = 75, camera.updateProjectionMatrix();
  const missing = info.doors.filter((d) => !train.getObjectByName(d.node)).map((d) => d.node);
  const msg = "shinkansen " + tris(train) + " tris · platform " + tris(platform) + " tris · " + info.doors.length + " doors" +
    (missing.length ? " · MISSING " + missing.join(",") : "") + " · view " + view + (openDoors ? " · doors open" : "");
  status.innerHTML = "<b>loaded</b> " + msg;
  document.title = "LOADED train";
  console.log("GLB_LOADED", msg);
}).catch((e) => { status.textContent = "load error: " + e; console.log("GLB_ERROR", e && (e.message || e)); });

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();
</script>
</body>
</html>
