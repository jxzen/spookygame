<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 760" width="715" height="760" font-family="Arial, sans-serif">
  <title>Mission 1 map: Kagemachi at night (draft)</title>
  <!-- Scale: 5 px = 1 m. Map x (east) = 20 + 5*x_m ; map y = 570 - 5*y_m (north up). -->
  <defs>
    <pattern id="solid" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#1b1b1b"/><path d="M0 6 L6 0" stroke="#2a2a2a" stroke-width="1"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c8102e"/></marker>
  </defs>
  <rect x="0" y="0" width="715" height="760" fill="#0b0b0c"/>
  <!-- solid blocks (not walkable) -->
  <g fill="url(#solid)" stroke="#333">
    <rect x="170" y="200" width="60" height="310"/>
    <rect x="470" y="220" width="40" height="290"/>
    <rect x="220" y="110" width="330" height="60"/>
    <rect x="20" y="200" width="150" height="370"/>
    <rect x="370" y="405" width="50" height="105"/><rect x="370" y="300" width="50" height="30"/><rect x="370" y="220" width="50" height="65"/>
  </g>
  <!-- walkable ground -->
  <g fill="#4a4a4a" stroke="none">
    <rect x="305" y="530" width="30" height="40"/>
    <rect x="220" y="510" width="320" height="20"/>
    <rect x="510" y="220" width="20" height="290"/>
    <rect x="230" y="200" width="15" height="310"/>
    <rect x="355" y="200" width="15" height="310"/>
    <rect x="370" y="390" width="50" height="15"/><rect x="370" y="285" width="50" height="15"/>
    <rect x="420" y="285" width="20" height="120"/>
    <rect x="120" y="170" width="550" height="50"/>
    <rect x="120" y="130" width="40" height="40"/>
    <rect x="60" y="30" width="160" height="100"/>
    <rect x="500" y="90" width="170" height="20"/>
  </g>
  <!-- arcade (covered) -->
  <rect x="290" y="220" width="30" height="290" fill="#6e6e6e" stroke="#9a9a9a" stroke-dasharray="4 3"/>
  <!-- canal -->
  <rect x="440" y="220" width="30" height="250" fill="#14181c" stroke="#2c3a44"/>
  <text x="455" y="345" fill="#55656f" font-size="9" text-anchor="middle" transform="rotate(-90 455 345)">canal (2 m below the lane)</text>
  <!-- shops: shut = dark, enterable = light -->
  <g stroke="#888" stroke-width="1">
    <rect x="255" y="475" width="35" height="35" fill="#262626"/>
    <rect x="255" y="440" width="35" height="35" fill="#bdbdbd"/>
    <rect x="255" y="405" width="35" height="35" fill="#262626"/>
    <rect x="255" y="370" width="35" height="35" fill="#262626"/>
    <rect x="255" y="335" width="35" height="35" fill="#bdbdbd"/>
    <rect x="255" y="280" width="35" height="55" fill="#262626"/>
    <rect x="255" y="220" width="35" height="60" fill="#262626"/>
    <rect x="320" y="460" width="35" height="50" fill="#262626"/>
    <rect x="320" y="425" width="35" height="35" fill="#bdbdbd"/>
    <rect x="320" y="390" width="35" height="35" fill="#262626"/>
    <rect x="320" y="350" width="35" height="40" fill="#262626"/>
    <rect x="320" y="300" width="35" height="50" fill="#bdbdbd"/>
    <rect x="320" y="220" width="35" height="80" fill="#262626"/>
    <rect x="370" y="330" width="50" height="60" fill="#bdbdbd"/>
    <rect x="110" y="40" width="60" height="30" fill="#8a8a8a"/>
    <rect x="70" y="80" width="30" height="30" fill="#bdbdbd"/>
    <rect x="560" y="110" width="90" height="60" fill="#8a8a8a"/>
  </g>
  <!-- doors (white ticks) -->
  <g stroke="#fff" stroke-width="3">
    <line x1="290" y1="452" x2="290" y2="462"/><line x1="255" y1="452" x2="255" y2="462"/>
    <line x1="290" y1="347" x2="290" y2="357"/><line x1="255" y1="347" x2="255" y2="357"/>
    <line x1="320" y1="437" x2="320" y2="447"/><line x1="355" y1="437" x2="355" y2="447"/>
    <line x1="320" y1="320" x2="320" y2="330"/><line x1="355" y1="310" x2="355" y2="320"/>
    <line x1="370" y1="355" x2="370" y2="365"/><line x1="420" y1="365" x2="420" y2="375"/>
    <line x1="85" y1="80" x2="95" y2="80"/><line x1="100" y1="90" x2="100" y2="100"/>
  </g>
  <!-- station gate: red shutter, locked until the shift -->
  <line x1="580" y1="170" x2="600" y2="170" stroke="#c8102e" stroke-width="4"/>
  <!-- tracks and freight train -->
  <g stroke="#555"><line x1="500" y1="60" x2="670" y2="60"/><line x1="500" y1="80" x2="670" y2="80"/></g>
  <rect x="520" y="55" width="150" height="30" fill="#2a2a2a" stroke="#aaa"/>
  <rect x="493" y="48" width="8" height="44" fill="#000" stroke="#777"/>
  <!-- collapsed overpass -->
  <rect x="490" y="380" width="60" height="40" fill="#3a2a2a" stroke="#c8102e" stroke-dasharray="3 2"/>
  <!-- loops -->
  <g fill="none" stroke="#e8e6e1" stroke-width="1" stroke-dasharray="2 4">
    <rect x="243" y="350" width="62" height="112"/>
    <rect x="305" y="318" width="57" height="128"/>
    <rect x="362" y="292" width="68" height="106"/>
  </g>
  <!-- critical path -->
  <polyline fill="none" stroke="#c8102e" stroke-width="2.5" marker-end="url(#arr)"
    points="320,550 305,510 305,458 272,458 305,458 305,325 335,325 362,340 362,360 395,360 362,360 362,195 140,195 140,150 200,82 140,58"/>
  <!-- shift path (walk-through) -->
  <polyline fill="none" stroke="#c8102e" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arr)" points="140,58 140,195 575,195 590,172 590,100 600,72"/>
  <!-- glimpse sight line, 35 m -->
  <line x1="305" y1="395" x2="305" y2="222" stroke="#e8e6e1" stroke-width="1" stroke-dasharray="1 3"/>
  <!-- markers -->
  <g font-size="10" font-weight="bold">
    <circle cx="320" cy="550" r="7" fill="#e8e6e1"/><text x="320" y="554" text-anchor="middle" fill="#000">S</text>
    <rect x="263" y="449" width="16" height="16" fill="#c8102e"/><text x="271" y="461" text-anchor="middle" fill="#fff">1</text>
    <rect x="392" y="343" width="16" height="16" fill="#c8102e"/><text x="400" y="355" text-anchor="middle" fill="#fff">2</text>
    <rect x="192" y="74" width="16" height="16" fill="#c8102e"/><text x="200" y="86" text-anchor="middle" fill="#fff">3</text>
  </g>
  <g fill="none" stroke="#e8e6e1" stroke-width="1.5">
    <circle cx="276" cy="468" r="5"/><circle cx="266" cy="343" r="5"/><circle cx="343" cy="452" r="5"/><circle cx="338" cy="315" r="5"/>
    <circle cx="384" cy="372" r="5"/><circle cx="410" cy="338" r="5"/><circle cx="85" cy="95" r="5"/><circle cx="625" cy="140" r="5"/>
  </g>
  <g fill="#000" stroke="#c8102e" stroke-width="2">
    <polygon points="350,513 357,520 350,527 343,520"/><polygon points="395,303 402,310 395,317 388,310"/>
    <polygon points="140,63 147,70 140,77 133,70"/><polygon points="487,63 494,70 487,77 480,70"/>
  </g>
  <g fill="#9a9a9a" font-size="9" font-weight="bold">
    <text x="232" y="503">Y1</text><text x="336" y="436">Y2</text><text x="378" y="327">Y3</text><text x="128" y="117">Y4</text><text x="250" y="190">Y5</text>
  </g>
  <g fill="#e8e6e1" font-size="9">
    <text x="309" y="226">G (glimpse, 35 m)</text>
    <text x="372" y="384" fill="#c8102e">SH</text>
    <circle cx="185" cy="110" r="4" fill="#7a8a96"/><text x="160" y="124">P (basin)</text>
    <circle cx="580" cy="100" r="4" fill="#c8102e"/><text x="540" y="124" fill="#c8102e">F (red lamp)</text>
  </g>
  <!-- labels -->
  <g fill="#cfccc4" font-size="9">
    <text x="300" y="565">underpass (start)</text>
    <text x="305" y="300" transform="rotate(-90 305 300)" text-anchor="middle">SHOTENGAI ARCADE (covered, 6 m x 58 m)</text>
    <text x="237" y="300" transform="rotate(-90 237 300)" text-anchor="middle">west alley 3 m</text>
    <text x="362" y="250" transform="rotate(-90 362 250)" text-anchor="middle">yokocho 3 m (red lanterns)</text>
    <text x="430" y="270" transform="rotate(-90 430 270)" text-anchor="middle">canal lane 4 m</text>
    <text x="257" y="472" font-size="8" fill="#111">pharmacy</text>
    <text x="257" y="366" font-size="8" fill="#111">kimono</text>
    <text x="322" y="434" font-size="8" fill="#111">noodles</text>
    <text x="322" y="345" font-size="8" fill="#111">pachinko</text>
    <text x="374" y="340" font-size="8" fill="#111">IZAKAYA</text>
    <text x="330" y="190">EKIMAE-DORI (plaza road, 10 m)</text>
    <text x="122" y="167">stairs, 40 steps</text>
    <text x="146" y="138">torii</text>
    <text x="112" y="36">haiden (bell)</text>
    <text x="64" y="76">kura</text>
    <text x="196" y="62">ema wall</text>
    <text x="566" y="106">STATION</text>
    <text x="566" y="165" font-size="8">gate (locked)</text>
    <text x="540" y="50">freight (03:10)</text>
    <text x="492" y="376" fill="#c8102e">overpass down</text>
    <text x="514" y="470" transform="rotate(-90 514 470)">north road (blocked)</text>
    <text x="246" y="476" fill="#e8e6e1">A 70 m</text><text x="309" y="452" fill="#e8e6e1">B 74 m</text><text x="424" y="410" fill="#e8e6e1">C 64 m</text>
  </g>
  <!-- scale bar -->
  <g transform="translate(560,540)"><rect width="100" height="5" fill="#e8e6e1"/><text x="0" y="18" fill="#e8e6e1" font-size="9">0</text><text x="100" y="18" fill="#e8e6e1" font-size="9" text-anchor="end">20 m</text></g>
  <text x="680" y="40" fill="#e8e6e1" font-size="12" text-anchor="middle">N &#8593;</text>
  <!-- legend -->
  <g font-size="10" fill="#cfccc4" transform="translate(20,590)">
    <text x="0" y="0" font-size="12" fill="#e8e6e1">Mission 1: Kagemachi (draft). 5 px = 1 m. 135 m x 110 m.</text>
    <polyline points="0,18 30,18" stroke="#c8102e" stroke-width="2.5"/><text x="36" y="22">critical path (about 300 m before the shift)</text>
    <polyline points="0,36 30,36" stroke="#c8102e" stroke-width="2" stroke-dasharray="8 5"/><text x="36" y="40">world shift walk-through (about 110 m, felt as 150 m)</text>
    <rect x="0" y="48" width="12" height="12" fill="#c8102e"/><text x="18" y="58">1-3 intel notes</text>
    <circle cx="6" cy="72" r="5" fill="none" stroke="#e8e6e1"/><text x="18" y="76">hiding spot (8)</text>
    <polygon points="6,82 12,88 6,94 0,88" fill="#000" stroke="#c8102e" stroke-width="2"/><text x="18" y="92">D: hunter's backstage door (drain, roof, shrine underfloor, rail tunnel)</text>
    <rect x="0" y="100" width="12" height="12" fill="#bdbdbd"/><text x="18" y="110">enterable shop (2 doors each)</text>
    <rect x="160" y="100" width="12" height="12" fill="#262626" stroke="#888"/><text x="178" y="110">shuttered shop</text>
    <rect x="300" y="48" width="30" height="10" fill="none" stroke="#e8e6e1" stroke-dasharray="2 4"/><text x="336" y="57">loops A, B, C (escape circuits)</text>
    <text x="300" y="76">Y1-Y5 yokai glimpses; G glimpse; SH shadow; P partial; F full reveal</text>
    <text x="300" y="110">white ticks = doors</text>
  </g>
</svg>
